name: Dashboard release assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          # macos-13 was retired by GitHub in 2025-12; use the supported Intel runner label.
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - run: npm ci
      - run: npm run build:dashboard
      - run: npm run manifest:dashboard
      - run: npm run verify:dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ matrix.target }}
          path: |
            dist/dashboard/**/*.tar.gz
            dist/dashboard/**/*.asset.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          pattern: dashboard-*
          path: dist/dashboard
          merge-multiple: true
      - run: npm run manifest:dashboard
      - name: Verify tag matches package version
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dashboard/**/*.tar.gz
            dist/dashboard/dashboard-manifest.json
          fail_on_unmatched_files: true
